##############################################
#  MySQL profil
#  Pokretanje: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#  Pre pokretanja u MySQL-u napraviti bazu:
#     CREATE DATABASE salon_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
##############################################

spring.datasource.url=jdbc:mysql://localhost:3306/salon_db?useSSL=false&serverTimezone=Europe/Belgrade&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# update: sema se dopunjava, podaci ostaju sacuvani izmedju pokretanja
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 konzola nije potrebna kada se koristi MySQL
spring.h2.console.enabled=false
