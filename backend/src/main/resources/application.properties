##############################################
#  IT355 - Kozmeticki salon (backend)
#  Osnovna konfiguracija aplikacije
##############################################

spring.application.name=salon-backend
server.port=8080

##############################################
#  BAZA PODATAKA - H2 (in-memory, za razvoj)
#  Za MySQL pokrenuti sa: --spring.profiles.active=mysql
##############################################
spring.datasource.url=jdbc:h2:mem:salondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web konzola: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

##############################################
#  JPA / HIBERNATE
##############################################
# create-drop: sema se pravi na startu i brise na gasenju aplikacije
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

##############################################
#  JWT KONFIGURACIJA
#  (tajni kljuc mora imati minimum 32 karaktera / 256 bita za HMAC-SHA;
#   za ovaj kljuc jjwt bira HS512)
##############################################
jwt.secret=IT355-tajni-kljuc-za-potpisivanje-JWT-tokena-kozmeticki-salon-2026
# 24h u milisekundama
jwt.expiration-ms=86400000

##############################################
#  POSLOVNA PRAVILA SALONA
##############################################
# Radno vreme salona - termin mora u celosti stati u ovaj interval
salon.radno-vreme.pocetak=08:00
salon.radno-vreme.kraj=20:00

# Popusti (u procentima)
salon.popust.student=10
salon.popust.lojalnost=5
# Broj zavrsenih termina posle kojeg klijent dobija lojaliti popust
salon.popust.lojalnost-prag=5

# Minimalan broj sati pre pocetka termina do kada je otkazivanje dozvoljeno
salon.otkazivanje.min-sati-ranije=2

##############################################
#  LOGOVANJE
##############################################
logging.level.rs.ac.metropolitan.salon=DEBUG
logging.level.org.springframework.security=INFO
