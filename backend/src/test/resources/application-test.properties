##############################################
#  Konfiguracija koja vazi SAMO u testovima
#  (aktivira se sa @ActiveProfiles("test"))
##############################################

# Zasebna in-memory baza koja se pravi i brise za svaku test klasu
spring.datasource.url=jdbc:h2:mem:salon_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# DataSeeder je iskljucen profilom "!test" - testovi sami prave svoje podatke

jwt.secret=test-tajni-kljuc-za-JWT-tokene-u-integracionim-testovima-IT355
jwt.expiration-ms=3600000

salon.radno-vreme.pocetak=08:00
salon.radno-vreme.kraj=20:00
salon.popust.student=10
salon.popust.lojalnost=5
salon.popust.lojalnost-prag=5
salon.otkazivanje.min-sati-ranije=2

logging.level.rs.ac.metropolitan.salon=WARN
logging.level.org.springframework=WARN
